[package]
name = "ggg-timer"
version = "0.1.5"
description = "God Gamer Gauntlet desktop timer. Local clock; website is the ledger."
authors = ["God Gamer Gauntlet"]
edition = "2021"

[lib]
name = "ggg_timer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
